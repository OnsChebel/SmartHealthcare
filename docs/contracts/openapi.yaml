      - patient-portal-controller
      operationId: getRendezVous
      parameters:
      - name: patientId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RendezVous"
    post:
      tags:
      - patient-portal-controller
      operationId: creerRendezVous
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RendezVous"
